[project]
name = "liposome-aggregate-analyse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cupy>=14.0.1",
    "mdanalysis>=2.10.0",
    "mdtraj>=1.11.1.post1",
    "networkx>=3.6.1",
    "numba>=0.64.0",
    "numpy>=2.4.2",
    "open3d>=0.19.0",
    "pandas>=3.0.1",
    "pytest>=9.0.2",
    "rich>=14.3.3",
    "torch>=2.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N802",   # function name should be lowercase (TODO: fix in refactor)
    "N803",   # argument name should be lowercase (TODO: fix in refactor)
    "N806",   # variable in function should be lowercase (TODO: fix in refactor)
    "N801",   # class name should use CapWords (TODO: fix in refactor)
    "N813",   # camelcase imported as lowercase (MDAnalysis convention)
    "N999",   # invalid module name (TODO: rename files in refactor)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring CUDA GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
